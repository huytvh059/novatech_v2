server {
    listen 80;
    server_name 10.10.190.11 novatech.test;
    root /var/www/novatech/public;
    index index.php;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Phục vụ asset cục bộ của Agile Toolkit UI (không dùng CDN ngoài)
    location /atk-assets/ {
        alias /var/www/novatech/vendor/atk4/ui/public/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ /\. { deny all; }
    location ~* ^/(src|db|deploy|tools|tests|vendor|storage)(/|$) { deny all; }
    location ~* \.(sql|md|ini|log|bak|json|lock)$ { deny all; }
    location = /router.php { deny all; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { deny all; }

    access_log /var/log/nginx/novatech-access.log;
    error_log /var/log/nginx/novatech-error.log;
}
